<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Remote Explosion</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        body.light-on {
            background: radial-gradient(circle, #7362ff, #24243e);
            box-shadow: inset 0 0 150px rgba(255, 255, 255, 0.2);
        }

        /* Pult oynasi */
        .box {
            width: 280px;
            height: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Smayliklar orqada qolishi uchun */
        }

        .center-btn {
            width: 80px;
            height: 160px;
            background: rgba(255, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            z-index: 11;
        }

        .circle {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .left1 { top: 40px; left: 25px; }
        .left2 { top: 165px; left: 25px; }
        .left3 { top: 290px; left: 25px; }
        .right1 { top: 40px; right: 25px; }
        .right2 { top: 165px; right: 25px; }
        .right3 { top: 290px; right: 25px; }

        /* 1-funksiya: Input */
        #input-container {
            display: none;
            position: absolute;
            bottom: -80px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 220px;
            z-index: 12;
        }

        /* 5-funksiya: Otilib chiquvchi smayliklar */
        .emoji {
            position: absolute;
            font-size: 30px;
            user-select: none;
            pointer-events: none;
            z-index: 1; /* Pult orqasida bo'lishi uchun */
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(var(--tr));
                opacity: 0;
            }
        }

        /* Loader va Hello */
        .loader { display: none; width: 45px; height: 45px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; position: absolute; z-index: 15; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hello-text { display: none; color: white; font-size: 40px; font-weight: bold; z-index: 15; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <button class="center-btn" onclick="location.reload()">OFF</button>

    <div class="circle left1" onclick="toggleInput()">1</div>
    <div class="circle left2" onclick="showLoading()">2</div>
    <div class="circle left3" onclick="sayHello()">3</div>
    <div class="circle right1">4</div>
    <div class="circle right2" onclick="explodeEmojis()">5</div>
    <div class="circle right3" onclick="toggleLight()">6</div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Xabar...">
        <button onclick="sendAndClose()" style="background:#4caf50; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;">Yuborish</button>
    </div>
    
    <div class="loader" id="loader"></div>
    <div class="hello-text" id="hello">HELLO</div>
</div>

<script>
    const box = document.getElementById('mainBox');
    const inputCont = document.getElementById('input-container');
    const loader = document.getElementById('loader');
    const hello = document.getElementById('hello');

    function toggleInput() {
        inputCont.style.display = (inputCont.style.display === 'block') ? 'none' : 'block';
    }

    function sendAndClose() {
        const val = document.getElementById('userInput').value;
        if(val.trim() !== "") {
            alert('Xabar yuborildi: ' + val);
            document.getElementById('userInput').value = "";
            inputCont.style.display = 'none';
        }
    }

    function showLoading() {
        loader.style.display = 'block';
        setTimeout(() => { loader.style.display = 'none'; }, 3000);
    }

    function sayHello() {
        Array.from(box.children).forEach(child => {
            if(child.id !== 'hello') child.style.display = 'none';
        });
        hello.style.display = 'block';
    }

    // 5. Smayliklarning otilib chiqishi
    function explodeEmojis() {
        const emojis = ['😊', '🚀', '✨', '🔥', '💎', '🌈', '🎉', '💥', '⚡️'];
        const amount = 40; // Smayliklar soni

        for (let i = 0; i < amount; i++) {
            const e = document.createElement('div');
            e.className = 'emoji';
            e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Portlash yo'nalishini hisoblash (tasodifiy radius va burchak)
            const angle = Math.random() * Math.PI * 2;
            const velocity = 200 + Math.random() * 400; // Qanchalik uzoqqa otilishi
            const tx = Math.cos(angle) * velocity + 'px';
            const ty = Math.sin(angle) * velocity + 'px';
            const tr = (Math.random() * 360) + 'deg';

            e.style.setProperty('--tx', tx);
            e.style.setProperty('--ty', ty);
            e.style.setProperty('--tr', tr);

            // Animatsiya
            e.style.animation = `explode ${1 + Math.random()}s ease-out forwards`;

            // Pult markazidan chiqarish
            e.style.left = '50%';
            e.style.top = '50%';

            document.body.appendChild(e);

            // Animatsiya tugagach o'chirish
            setTimeout(() => e.remove(), 2000);
        }
    }

    function toggleLight() {
        document.body.classList.toggle('light-on');
    }
</script>

</body>
</html>
