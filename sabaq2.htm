<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Remote Pro</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* 6-funksiya: Chiroq effekti */
        body.light-on {
            background: radial-gradient(circle, #7362ff, #24243e);
            box-shadow: inset 0 0 150px rgba(255, 255, 255, 0.2);
        }

        /* Asosiy Glassmorphism oynasi */
        .box {
            width: 280px;
            height: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        /* Markaziy OFF tugmasi */
        .center-btn {
            width: 80px;
            height: 160px;
            background: rgba(255, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            z-index: 5;
        }

        .center-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            transform: scale(1.05);
        }

        /* Dumaloq tugmalar */
        .circle {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .circle:hover { background: rgba(255, 255, 255, 0.3); }

        .left1 { top: 40px; left: 25px; }
        .left2 { top: 165px; left: 25px; }
        .left3 { top: 290px; left: 25px; }
        .right1 { top: 40px; right: 25px; }
        .right2 { top: 165px; right: 25px; }
        .right3 { top: 290px; right: 25px; }

        /* 1-funksiya: Input */
        #input-container {
            display: none;
            position: absolute;
            bottom: -80px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 220px;
            text-align: center;
        }
        #input-container input {
            padding: 6px;
            border-radius: 5px;
            border: none;
            outline: none;
            width: 120px;
        }
        #input-container button {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        /* 2-funksiya: Loader */
        .loader {
            display: none;
            width: 45px;
            height: 45px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 3-funksiya: Hello */
        .hello-text {
            display: none;
            color: white;
            font-size: 35px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* 5-funksiya: Smayliklar */
        .emoji {
            position: absolute;
            top: -50px;
            font-size: 28px;
            user-select: none;
            animation: fall 3s linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <!-- OFF tugmasi (Reset) -->
    <button class="center-btn" onclick="location.reload()">OFF</button>

    <!-- Tugmalar -->
    <div class="circle left1" onclick="toggleInput()">1</div>
    <div class="circle left2" onclick="showLoading()">2</div>
    <div class="circle left3" onclick="sayHello()">3</div>

    <div class="circle right1">4</div>
    <div class="circle right2" onclick="rainEmojis()">5</div>
    <div class="circle right3" onclick="toggleLight()">6</div>

    <!-- Elementlar -->
    <div id="input-container">
        <input type="text" id="userInput" placeholder="Xabar...">
        <button onclick="sendAndClose()">Yuborish</button>
    </div>
    
    <div class="loader" id="loader"></div>
    <div class="hello-text" id="hello">HELLO</div>
</div>

<script>
    const box = document.getElementById('mainBox');
    const inputCont = document.getElementById('input-container');
    const loader = document.getElementById('loader');
    const hello = document.getElementById('hello');

    // 1-tugma: Inputni ochish/yopish
    function toggleInput() {
        inputCont.style.display = (inputCont.style.display === 'block') ? 'none' : 'block';
    }

    // 1-tugma: Yuborish va inputni yo'qotish
    function sendAndClose() {
        const val = document.getElementById('userInput').value;
        if(val.trim() !== "") {
            alert('Xabar yuborildi: ' + val);
            document.getElementById('userInput').value = ""; // Tozalash
            inputCont.style.display = 'none'; // Inputni yashirish
        } else {
            alert('Iltimos, xabar yozing!');
        }
    }

    // 2-tugma: Loading
    function showLoading() {
        loader.style.display = 'block';
        setTimeout(() => { loader.style.display = 'none'; }, 3000);
    }

    // 3-tugma: Faqat HELLO qolsin
    function sayHello() {
        Array.from(box.children).forEach(child => {
            if(child.id !== 'hello') {
                child.style.display = 'none';
            }
        });
        hello.style.display = 'block';
    }

    // 5-tugma: Smayliklar yomg'iri
    function rainEmojis() {
        const emojis = ['😊', '🚀', '✨', '🔥', '💎', '🌈', '🎉'];
        for (let i = 0; i < 25; i++) {
            setTimeout(() => {
                const e = document.createElement('div');
                e.className = 'emoji';
                e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                e.style.left = Math.random() * 100 + 'vw';
                e.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 4000);
            }, i * 150);
        }
    }

    // 6-tugma: Chiroqni yoqish
    function toggleLight() {
        document.body.classList.toggle('light-on');
    }
</script>

</body>
</html>
